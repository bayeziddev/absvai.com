name: Test and deploy

on:
  pull_request:
  push:
    # Every push to main tests, then updates the live site on Cloudflare.
    branches: [main]
  # Manual deploy from the Actions tab (any branch), e.g. to put a feature branch live before it is merged.
  workflow_dispatch:
    inputs:
      load_demo_catalog:
        description: Add the 17 demo products (skipped if they are already there)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript build check
        run: npm run typecheck
      - name: Generated files are up to date
        run: |
          npm run gen:seed
          npm run gen:geo
          npm run gen:postcode-bn
          git diff --exit-code -- worker/migrations worker/seed data/geo worker/src/generated
      - name: Unit and integration tests (real D1/KV/R2 via local workerd)
        run: npm test
      - name: Production config builds (dry run)
        run: npm run build && npx wrangler deploy --dry-run -c worker/wrangler.toml
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check repository secrets
        env:
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: |
          missing=()
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SETUP_TOKEN; do
            [ -n "${!s}" ] || missing+=("$s")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Add these repository secrets (Settings → Secrets and variables → Actions): ${missing[*]}. See docs/DEPLOY.md."
            exit 1
          fi

      - name: Find or create D1, KV and R2 (ids written into wrangler.toml for this run)
        id: resources
        run: node scripts/ensure-cloudflare-resources.mjs

      - name: Build static assets
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote -c worker/wrangler.toml

      - name: Load the demo catalog (skipped if its products are already there)
        if: github.event_name == 'workflow_dispatch' && inputs.load_demo_catalog
        run: |
          # The demo adds 17 products next to any real ones; it is skipped if any of them exists already.
          slugs=$(grep -oE "^INSERT INTO products \([^)]*\) VALUES \('[a-z0-9-]+'" worker/seed/demo.sql | grep -oE "'[a-z0-9-]+'$" | paste -sd, -)
          n=$(npx wrangler d1 execute DB --remote -c worker/wrangler.toml --json --command "SELECT COUNT(*) AS n FROM products WHERE slug IN ($slugs)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))')
          if [ "$n" = "0" ]; then
            npx wrangler d1 execute DB --remote -c worker/wrangler.toml --file worker/seed/demo.sql
            echo "Demo catalog loaded (17 products)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$n demo product(s) are already in the store; demo catalog not loaded again." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy the Worker with its secrets
        env:
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SETTINGS_KEY: ${{ secrets.SETTINGS_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          # Email (Resend). Also accepts the secret under a similar name.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || secrets.RESEND_API || secrets.RESEND_KEY || secrets.RESEND }}
          WORKERS_DEV_URL: ${{ steps.resources.outputs.workers_dev_url }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # GitHub secrets that are set, plus OTP_PEPPER / SIGNING_KEY / SETTINGS_KEY created once on the first deploy and kept
          # on Cloudflare afterwards. Secrets left out of the file keep their current value on the Worker.
          node scripts/worker-secrets.mjs "$secrets_file"
          # Until absvai.com is connected, links in SMS, the sitemap and canonical tags point at the workers.dev address.
          extra=()
          [ -n "$WORKERS_DEV_URL" ] && extra=(--var "SITE_URL:$WORKERS_DEV_URL")
          npx wrangler deploy -c worker/wrangler.toml --secrets-file "$secrets_file" "${extra[@]}"

      - name: Smoke test the live site
        env:
          HAS_ZONE: ${{ steps.resources.outputs.has_zone }}
          WORKERS_DEV_URL: ${{ steps.resources.outputs.workers_dev_url }}
        run: |
          if [ "$HAS_ZONE" = "true" ]; then base="https://absvai.com"; else base="$WORKERS_DEV_URL"; fi
          [ -n "$base" ] || base=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-output.json" | head -1)
          if [ -z "$base" ]; then echo "::warning::Could not find the deployed URL; skipping the smoke test."; exit 0; fi
          {
            echo "## Live site: $base"
            echo "## Admin dashboard: $base/admin/"
            echo "First visit to the admin asks for SETUP_TOKEN once, to create the Super Admin."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Live site: $base · Admin: $base/admin/"
          for path in /robots.txt / /admin/ /api/geo/version; do
            ok=""
            # A brand-new workers.dev address can take a few minutes to answer (DNS and certificate), so allow up to ~5 minutes.
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path") && [ "$code" = "200" ] && ok=1 && break
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::$base$path answered $code"; exit 1; }
            echo "- $path: 200" >> "$GITHUB_STEP_SUMMARY"
          done
