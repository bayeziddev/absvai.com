# Temporary helper: brings full-resolution photos made in Figma into public/img/photos as responsive WebP sets.
# The photo links are passed when the run is started (they expire), so they never go into the repository.
name: Import photos

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/import-photos.yml']
  workflow_dispatch:
    inputs:
      list:
        description: One "name kind zoom url" per line
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Pillow
        run: python3 -m venv /tmp/py && /tmp/py/bin/pip install --quiet pillow
      - name: Download and convert
        env:
          LIST: ${{ inputs.list }}
        run: printf '%s\n' "$LIST" | /tmp/py/bin/python .github/photo-import/photos.py public/img/photos
      - name: Commit the photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/img/photos
          git commit -m 'Add the category, product and banner photos made in Figma' -m 'Converted to responsive WebP sets by .github/photo-import/photos.py.'
          git push origin "HEAD:$GITHUB_REF_NAME"
