<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="app" aria-live="polite"><div class="boot"><div class="skel" aria-busy="true" aria-label="Loading"><i class="skel-h"></i><i class="skel-row"></i><i class="skel-box"></i></div></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="row-end"><button class="btn btn-ghost" value="no">Cancel</button><button class="btn btn-primary" value="yes">Yes, continue</button></div>
    </form>
  </dialog>
  <script type="module" src="/admin/js/app.js"></script>
</body>
</html>
